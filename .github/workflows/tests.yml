name: Tests

on:
  pull_request:
    paths:
      - 'logzio/*'
      - 'go.sum'
      - 'go.mod'
      - '.github/workflows/tests.yml'

jobs:
  discover:
    name: Discover test groups
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - id: matrix
        run: |
          matrix=$(bash scripts/generate-test-matrix.sh)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: "test: ${{ matrix.resource }}"
    needs: discover
    runs-on: ubuntu-24.04
    env:
      LOGZIO_API_TOKEN: ${{ secrets.LOGZIO_API_TOKEN }}
      LOGZIO_WARM_API_TOKEN: ${{ secrets.LOGZIO_WARM_API_TOKEN }}
      LOGZIO_CONSUMPTION_API_TOKEN: ${{ secrets.LOGZIO_CONSUMPTION_API_TOKEN }}
      TF_ACC: true
      LOGZIO_EMAIL: ${{ secrets.LOGZIO_EMAIL }}
      LOGZIO_ACCOUNT_ID: ${{ secrets.LOGZIO_ACCOUNT_ID }}
      LOGZIO_WARM_ACCOUNT_ID: ${{ secrets.LOGZIO_WARM_ACCOUNT_ID }}
      LOGZIO_CONSUMPTION_ACCOUNT_ID: ${{ secrets.LOGZIO_CONSUMPTION_ACCOUNT_ID }}
      S3_PATH: ${{ secrets.S3_PATH }}
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_ACCOUNT_NAME: ${{ secrets.AZURE_ACCOUNT_NAME }}
      AZURE_CONTAINER_NAME: ${{ secrets.AZURE_CONTAINER_NAME }}
      AWS_ARN: ${{ secrets.AWS_ARN }}
      AWS_ARN_S3_FETCHER: ${{ secrets.AWS_ARN_S3_FETCHER }}
      AWS_ACCESS_KEY_UPDATE: ${{ secrets.AWS_ACCESS_KEY_UPDATE }}
      AWS_SECRET_KEY_UPDATE: ${{ secrets.AWS_SECRET_KEY_UPDATE }}
      GRAFANA_FOLDER_UID: ${{ secrets.GRAFANA_FOLDER_UID }}
      LOGZIO_METRICS_ACCOUNT_ID: ${{ secrets.LOGZIO_METRICS_ACCOUNT_ID }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.24"

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Run tests
        working-directory: logzio
        run: |
          go clean -testcache
          gotestsum \
            --format short-verbose \
            --junitfile test-results.xml \
            --rerun-fails \
            --rerun-fails-max-failures 3 \
            --packages ./... \
            -- -race -covermode=atomic -coverprofile=coverage.out \
               -timeout 45m \
               -run "^(${{ matrix.tests }})$"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.resource }}
          path: logzio/test-results.xml
